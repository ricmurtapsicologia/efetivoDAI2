name: DAI2 production gates

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/python-personnel-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/python-personnel-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit personnel allowlist
        run: python scripts/personnel_pipeline.py audit --input data/data.js --report artifacts/personnel-audit.json
      - name: Audit production invariants
        run: python scripts/site_audit.py
      - name: Public GitHub Pages smoke 30/30
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/live_smoke.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dai2-audit
          path: artifacts/personnel-audit.json
          if-no-files-found: ignore
