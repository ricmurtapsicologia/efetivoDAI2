name: DAI2 production gates

on:
  pull_request:
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/python-personnel-audit.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'data/**'
      - 'scripts/**'
      - '.github/workflows/python-personnel-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Audit personnel allowlist
        run: python scripts/personnel_pipeline.py audit --input data/data.js --report artifacts/personnel-audit.json
      - name: Audit production invariants + WhatsApp directory
        run: python scripts/site_audit.py
      - name: Install browser audit
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Start local portal
        run: |
          python -m http.server 8000 --bind 127.0.0.1 > /tmp/dai2-http.log 2>&1 &
          echo $! > /tmp/dai2-http.pid
          sleep 2
      - name: E2E + QA + Accessibility + UX + UI
        env:
          DAI2_BASE_URL: http://127.0.0.1:8000
        run: python scripts/browser_e2e.py
      - name: Public GitHub Pages smoke 30/30
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python scripts/live_smoke.py
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: dai2-audit
          path: artifacts/personnel-audit.json
          if-no-files-found: ignore
