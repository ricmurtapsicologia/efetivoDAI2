name: Internalizar banner CBMMG

on:
  push:
    branches: [dai2-banner-cbmmg-aesthetic-2026-09-07]
    paths:
      - '.github/workflows/internalize-banner-cbmmg.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  internalize-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Selecionar e internalizar fotografia de alta resolução
        run: |
          set -euo pipefail
          mkdir -p assets/img
          python -m pip install --quiet pillow
          UA='Mozilla/5.0 (compatible; DAI2AssetBot/1.0)'
          rm -f assets/img/banner-cbmmg.jpg assets/img/banner-cbmmg-source.txt /tmp/banner-candidate.jpg
          SOURCES=(
            'https://i.pinimg.com/originals/33/9d/0c/339d0cc2f05bbb719debe6a5efb414dd.jpg'
            'https://i.pinimg.com/originals/38/70/c5/3870c5a678e72a0c16ca58914e14df3f.jpg'
            'https://i.pinimg.com/originals/11/a1/77/11a177ae248e628148fdb30fdf448f9e.jpg'
            'https://images.unsplash.com/photo-1697952433648-d1ad0e6cda00?auto=format&fit=crop&w=2400&q=90'
          )
          for URL in "${SOURCES[@]}"; do
            echo "Tentando $URL"
            rm -f /tmp/banner-candidate.jpg
            if ! curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 90 -A "$UA" "$URL" -o /tmp/banner-candidate.jpg; then
              continue
            fi
            if ! test -s /tmp/banner-candidate.jpg || ! file /tmp/banner-candidate.jpg | grep -Eqi 'JPEG|image data'; then
              continue
            fi
            WIDTH=$(python - <<'PY'
          from PIL import Image
          p='/tmp/banner-candidate.jpg'
          with Image.open(p) as im:
              print(im.width)
              print(f'Candidato: {im.width}x{im.height}', file=__import__('sys').stderr)
          PY
            )
            if [ "$WIDTH" -ge 1600 ]; then
              mv /tmp/banner-candidate.jpg assets/img/banner-cbmmg.jpg
              printf '%s\n' "$URL" > assets/img/banner-cbmmg-source.txt
              break
            fi
          done
          test -s assets/img/banner-cbmmg.jpg
          python - <<'PY'
          from PIL import Image
          p='assets/img/banner-cbmmg.jpg'
          with Image.open(p) as im:
              print(f'Banner selecionado: {im.width}x{im.height}')
              if im.width < 1600:
                  raise SystemExit('Hero abaixo de 1600 px')
          PY
          echo "Fonte selecionada: $(cat assets/img/banner-cbmmg-source.txt)"
      - name: Commitar asset local
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/banner-cbmmg.jpg assets/img/banner-cbmmg-source.txt
          if git diff --cached --quiet; then
            echo 'Banner já internalizado.'
            exit 0
          fi
          git commit -m 'assets: internalizar banner CBMMG em alta resolução'
          git pull --rebase origin dai2-banner-cbmmg-aesthetic-2026-09-07
          git push origin HEAD:dai2-banner-cbmmg-aesthetic-2026-09-07
