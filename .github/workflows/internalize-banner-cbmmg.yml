name: Internalizar banner CBMMG

on:
  push:
    branches: [dai2-banner-cbmmg-aesthetic-2026-09-07]
    paths:
      - '.github/workflows/internalize-banner-cbmmg.yml'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  internalize-banner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Selecionar e internalizar fotografia CBMMG
        run: |
          set -euo pipefail
          mkdir -p assets/img
          python -m pip install --quiet pillow
          UA='Mozilla/5.0 (compatible; DAI2AssetBot/1.0)'
          rm -f /tmp/banner-candidate.jpg
          SELECTED=''
          SOURCES=(
            'https://www.bombeiros.mg.gov.br/storage/images/17120885802.jpeg'
            'https://i.pinimg.com/originals/11/a1/77/11a177ae248e628148fdb30fdf448f9e.jpg'
          )
          for URL in "${SOURCES[@]}"; do
            echo "Tentando $URL"
            rm -f /tmp/banner-candidate.jpg
            if ! curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 -A "$UA" "$URL" -o /tmp/banner-candidate.jpg; then
              continue
            fi
            if test -s /tmp/banner-candidate.jpg && file /tmp/banner-candidate.jpg | grep -Eqi 'JPEG|image data'; then
              SELECTED="$URL"
              break
            fi
          done
          test -n "$SELECTED"
          test -s /tmp/banner-candidate.jpg
          SELECTED="$SELECTED" python - <<'PY'
          from PIL import Image, ImageEnhance, ImageFilter
          import os
          src='/tmp/banner-candidate.jpg'
          dst='assets/img/banner-cbmmg.jpg'
          with Image.open(src) as im:
              im = im.convert('RGB')
              print(f'Fonte original: {im.width}x{im.height}')
              if im.width < 2400:
                  ratio = 2400 / im.width
                  new_size = (2400, round(im.height * ratio))
                  im = im.resize(new_size, Image.Resampling.LANCZOS)
                  im = ImageEnhance.Contrast(im).enhance(1.035)
                  im = im.filter(ImageFilter.UnsharpMask(radius=1.1, percent=105, threshold=3))
              im.save(dst, 'JPEG', quality=91, optimize=True, progressive=True)
              print(f'Banner final: {im.width}x{im.height}')
          with open('assets/img/banner-cbmmg-source.txt','w',encoding='utf-8') as f:
              f.write(os.environ['SELECTED']+'\n')
          PY
          echo "Fonte selecionada: $SELECTED"
      - name: Commitar asset local
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/banner-cbmmg.jpg assets/img/banner-cbmmg-source.txt
          if git diff --cached --quiet; then
            echo 'Banner CBMMG já está internalizado.'
            exit 0
          fi
          git commit -m 'assets: internalizar banner institucional CBMMG'
          git pull --rebase origin dai2-banner-cbmmg-aesthetic-2026-09-07
          git push origin HEAD:dai2-banner-cbmmg-aesthetic-2026-09-07
