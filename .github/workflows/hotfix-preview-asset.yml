name: Hotfix preview logo DAI2

on:
  push:
    paths:
      - '.github/workflows/hotfix-preview-asset.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Download DAI2 logo from Pinterest
        run: |
          curl -fL --retry 3 --retry-delay 2 \
            -A 'Mozilla/5.0 (compatible; DAI2PreviewBuilder/1.0)' \
            'https://i.pinimg.com/736x/5b/1e/9f/5b1e9f547379eee022fc6ecc7328d573.jpg' \
            -o /tmp/dai2-logo.jpg
          test -s /tmp/dai2-logo.jpg
      - name: Build 1200x630 social preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image, ImageOps
          src = Image.open('/tmp/dai2-logo.jpg').convert('RGB')
          canvas = Image.new('RGB', (1200, 630), '#0b2338')
          logo = ImageOps.contain(src, (980, 520), Image.Resampling.LANCZOS)
          x = (1200 - logo.width) // 2
          y = (630 - logo.height) // 2
          canvas.paste(logo, (x, y))
          canvas.save('assets/img/dai2-logo-preview.jpg', 'JPEG', quality=90, optimize=True, progressive=True)
          print('preview:', canvas.size, 'logo:', logo.size)
          PY
      - name: Patch Open Graph to DAI2 logo preview
        run: |
          python - <<'PY'
          from pathlib import Path
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = 'https://ricmurtapsicologia.github.io/efetivoDAI2/assets/img/cidade-administrativa-preview.jpg'
          new = 'https://ricmurtapsicologia.github.io/efetivoDAI2/assets/img/dai2-logo-preview.jpg'
          if old not in text and new not in text:
              raise SystemExit('Preview URL esperado não encontrado em index.html')
          text = text.replace(old, new)
          text = text.replace('Cidade Administrativa de Minas Gerais — banner do Portal DAI/2', 'Logo institucional DAI/2 — Diretoria de Assuntos Institucionais')
          index.write_text(text, encoding='utf-8')

          smoke = Path('scripts/share_preview_smoke.py')
          s = smoke.read_text(encoding='utf-8')
          s = s.replace('assets/img/cidade-administrativa-preview.jpg', 'assets/img/dai2-logo-preview.jpg')
          s = s.replace('cidade-administrativa-preview.jpg', 'dai2-logo-preview.jpg')
          s = s.replace('Cidade Administrativa', 'logo DAI/2')
          smoke.write_text(s, encoding='utf-8')
          PY
      - name: Commit preview asset and metadata
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/img/dai2-logo-preview.jpg index.html scripts/share_preview_smoke.py
          if git diff --cached --quiet; then
            echo 'Preview already current.'
          else
            git commit -m 'Troca preview social para logo institucional DAI2'
            git push origin HEAD:main
          fi
