name: Reuniao DAI2 - Smoke e E2E unico

on:
  push:
    paths:
      - '.github/workflows/reuniaodai2-e2e-once.yml'

jobs:
  smoke-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Smoke da rota pública e ativos
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://ricmurtapsicologia.github.io/efetivoDAI2/reuniaodai2/'
          BASE='https://ricmurtapsicologia.github.io/efetivoDAI2/reuniao-dai2/'
          APP='https://ricmurtapsicologia.github.io/efetivoDAI2/reuniao-dai2/app.js'
          CSS='https://ricmurtapsicologia.github.io/efetivoDAI2/reuniao-dai2/styles.css'
          for i in {1..30}; do
            curl -fsSL "$PAGE" -o /tmp/page-source.html || true
            if grep -q 'privacy.remove()' /tmp/page-source.html 2>/dev/null; then break; fi
            sleep 5
          done
          grep -q 'privacy.remove()' /tmp/page-source.html
          ! grep -q 'As respostas são registradas no Google Forms e na planilha vinculada' /tmp/page-source.html
          curl -fsSL "$BASE" -o /tmp/base.html
          curl -fsSL "$APP" -o /tmp/app.js
          curl -fsSL "$CSS" -o /tmp/styles.css
          grep -q 'Richelmy Murta, Major BM' /tmp/base.html
          grep -q 'Salvar cópia em PDF' /tmp/base.html
          grep -q 'AKfycbzb5if6p9WAnspybyGFdM5XUZQvk85tGWsV278eDYY0QVT267xrqCkJ9FLf1BbzArVS/exec' /tmp/app.js
          test -s /tmp/styles.css

      - name: Smoke renderizado em navegador headless
        shell: bash
        run: |
          set -euo pipefail
          PAGE='https://ricmurtapsicologia.github.io/efetivoDAI2/reuniaodai2/'
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --headless --no-sandbox --disable-gpu --virtual-time-budget=7000 --dump-dom "$PAGE" > /tmp/rendered.html
          grep -q 'Rastreio de informações e sugestões de pauta' /tmp/rendered.html
          grep -q 'Enviar à DAI/2' /tmp/rendered.html
          grep -q 'Canal de resposta: Google Forms integrado' /tmp/rendered.html
          ! grep -q 'As respostas são registradas no Google Forms e na planilha vinculada' /tmp/rendered.html

      - name: E2E real Apps Script para Forms, Sheets e e-mail
        shell: bash
        run: |
          set -euo pipefail
          ENDPOINT='https://script.google.com/macros/s/AKfycbzb5if6p9WAnspybyGFdM5XUZQvk85tGWsV278eDYY0QVT267xrqCkJ9FLf1BbzArVS/exec'
          export NOW_MS=$(($(date +%s%N)/1000000))
          export START_MS=$((NOW_MS-5000))
          export SUBMISSION_ID="dai2-e2e-${GITHUB_RUN_ID}"
          PAYLOAD=$(python3 -c 'import json,os; print(json.dumps({"version":"reuniao-dai2-2026-v1","submissionId":os.environ["SUBMISSION_ID"],"startedAt":int(os.environ["START_MS"]),"submittedAt":int(os.environ["NOW_MS"]),"answers":{"Nome completo":"TESTE E2E AUTOMÁTICO — DESCONSIDERAR","E-mail funcional":"ricmurtapsicologia@gmail.com","Posto/Graduação":"Maj","Órgão Externo":"Coordenação DAI/2","Situação prevista em 13/11":"Presença prevista","Assuntos da apresentação":"TESTE E2E AUTOMÁTICO — validação técnica de ponta a ponta; desconsiderar na consolidação da pauta.","Assuntos relevantes para a pauta":"TESTE E2E — DESCONSIDERAR"}},ensure_ascii=False,separators=(",",":")))')
          curl -fsSL --data-urlencode "payload=$PAYLOAD" "$ENDPOINT" -o /tmp/e2e-response.html
          grep -q 'REUNIAO_DAI2_SUBMIT_RESULT' /tmp/e2e-response.html
          grep -q '"ok":true' /tmp/e2e-response.html
          grep -q '"emailOk":true' /tmp/e2e-response.html
          echo "$SUBMISSION_ID"
